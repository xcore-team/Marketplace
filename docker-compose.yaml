services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-marketplace}
      - POSTGRES_USER=${POSTGRES_USER:-marketplace}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketplace}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - xcore-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6378:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - xcore-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - api-venv:/app/.venv
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - POSTGRES_PASSWORD=passwrds123Web600
      - POSTGRES_USER=marketplace
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketplace}
      - UV_LINK_MODE=copy
    env_file:
      - extensions/.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --log-level warning
    networks:
      - xcore-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    volumes:
      - .:/app
      - worker-venv:/app/.venv
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - POSTGRES_PASSWORD=passwrds123Web600
      - POSTGRES_USER=marketplace
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketplace}
      - UV_LINK_MODE=copy
    env_file:
      - extensions/.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uv run xcli worker start celery
    networks:
      - xcore-net

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - xcore-net

volumes:
  postgres-data:
  redis-data:
  api-venv:
  worker-venv:

networks:
  xcore-net:
    driver: bridge
