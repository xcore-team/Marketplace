version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - CELERY_BROKER_URL=redis://redis:6378/0
      - CELERY_RESULT_BACKEND=redis://redis:6378/1
    depends_on:
      - redis
    networks:
      - devnet

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6378:6379"
    volumes:
      - redis-data:/data
    networks:
      - devnet

volumes:
  redis-data:

networks:
  devnet:
