name: xdevkeys
version: 1.0.0
author: xcore
description: >
  Gestion des clés API et des clés de signature HMAC pour les développeurs.
  Permet d'authentifier le CLI xcore et de signer les plugins publiés.

execution_mode: trusted
entry_point: src/main.py
framework_version: ">=2.1.0"

requires:
  - name: auth
    version: ">=1.0.0"

envconfiguration:
  inject: true
  env_file: .env

env:
  DEVKEYS_MASTER_KEY: "${DEVKEYS_MASTER_KEY}"

permissions: []

resources:
  timeout_seconds: 30
  max_memory_mb: 128
  rate_limit:
    calls: 200
    period_seconds: 60

runtime:
  health_check:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 5
  retry:
    max_attempts: 3
    backoff_seconds: 2.0
