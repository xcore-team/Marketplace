name: marketplace
version: 1.0.0
author: xcore
description: >
  Marketplace de plugins xcore — soumission ZIP, pipeline de validation sandbox (9 gates),
  publication depuis GitHub, notifications email, enregistrement des plugins vérifiés.

execution_mode: trusted
entry_point: src/main.py
framework_version: ">=2.0.0"

# --- reaquires

requires:
  - name: auth
    version: 1.1.1

# ── Variables d'environnement ─────────────────────────────────────────────────
envconfiguration:
  inject: true
  env_file: .env.example

env:
  APP_NAME: "${MARKET_APP_NAME}"
  APP_BASE_URL: "${MARKET_APP_BASE_URL}"

  # Clé secrète HMAC pour la signature des plugins (gate 7)
  MARKET_SECRET_KEY: "${MARKET_SECRET_KEY}"

  # Limites sandbox — optionnelles (valeurs par défaut si absentes)
  SANDBOX_MEMORY_MB: "${MARKET_SANDBOX_MEMORY_MB}"
  SANDBOX_CPU_SECONDS: "${MARKET_SANDBOX_CPU_SECONDS}"
  SANDBOX_TIMEOUT: "${MARKET_SANDBOX_TIMEOUT}"

# ── Dépendances inter-plugins ─────────────────────────────────────────────────
# xauth doit être chargé avant marketplace :
# il enregistre le backend JWT global (register_auth_backend)
# que get_current_user utilise dans les routes marketplace.
requires:
  - auth

# ── Permissions inter-plugins ─────────────────────────────────────────────────
permissions:
  - resource: "ext.email"
    actions: ["send", "queue"]
    effect: allow

# ── Ressources ────────────────────────────────────────────────────────────────
resources:
  timeout_seconds: 120
  max_memory_mb: 512
  rate_limit:
    calls: 200
    period_seconds: 60

# ── Runtime ───────────────────────────────────────────────────────────────────
runtime:
  health_check:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 5
  retry:
    max_attempts: 2
    backoff_seconds: 3.0
