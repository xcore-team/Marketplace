name: xservices
version: 1.0.0
author: xcore
description: >
  Marketplace des extensions de service XCore.
  Permet aux développeurs de soumettre, valider et publier des extensions
  de service (BaseService) consommables par d'autres plugins XCore.

execution_mode: trusted
entry_point: src/main.py
framework_version: ">=2.1.0"

requires:
  - name: auth
    version: ">=1.0.0"

envconfiguration:
  inject: false

permissions: []

resources:
  timeout_seconds: 30
  max_memory_mb: 256
  rate_limit:
    calls: 200
    period_seconds: 60

runtime:
  health_check:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 5
  retry:
    max_attempts: 3
    backoff_seconds: 2.0
