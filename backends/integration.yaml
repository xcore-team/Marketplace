app:
  name: marketplace
  env: production
  debug: false
  secret_key: ${SECRET_KEY}
  dotenv: conf/.env
  plugin_prefix: "/app"
  server_key: ${SERVER_KEY}
  server_key_iterations: 100000
  plugin_tags:
    - "marketplace"

  server:
    app: main:app
    host: "0.0.0.0"
    port: 8000
    workers: 4
    reload: false
    log_level: warning

  fastapi:
    title: "Xcore Marketplace"
    summary: "xcore marketplace API for marketplace plugins"
    description: "Xcore marketplace API for marketplace plugins"
    version: "0.1.0"
    debug: true
    docs_url: /docs
    redoc_url: /redocs
    openapi_url: /openapi.json
    redirect_slashes: true
    terms_of_service: "https://xcorehub.dev"
    contact:
      name: "Support"
      email: "contact@xcorehub.dev"
    license_info:
      name: "Xcore Intern License"
    deprecated: false

# ── Plugins ───────────────────────────────────────────────────
plugins:
  directory: ./app

  # Clé HMAC-SHA256 utilisée pour vérifier plugin.sig
  secret_key: ${SECRET_KEY}

  # true = refuse tout plugin Trusted non signé
  strict_trusted: false

  # Intervalle du watcher de rechargement à chaud (secondes)
  interval: 10

  entry_point: src/main.py

  # Fichiers/extensions exclus du snapshot de détection de changements
  snapshot:
    extensions: [".log", ".pyc", ".html", ".map", ".min.js"]
    filenames: ["__pycache__", "__init__.py", ".env", ".DS_Store"]
    hidden: true

# ── Services ──────────────────────────────────────────────────
services:
  databases:
    db:
      type: sqlasync
      url: ${DATABASE_URL}
      echo: false
      pool_size: 10
      max_overflow: 20
      pool_pre_ping: true
      pool_recycle: 1800 # < wait_timeout MySQL (SHOW VARIABLES LIKE 'wait_timeout')
      pool_timeout: 30
      isolation_level: READ COMMITTED
      connect_args:
        connect_timeout: 10 # timeout TCP initial
        read_timeout: 30 # timeout lecture réseau
        write_timeout: 30 # timeout écriture réseau
        charset: utf8mb4
        pool_reset_on_return: rollback

  scheduler:
    enabled: true
    backend: memory # redis = tâches persistantes, survivent au redémarrage
    url: ${REDIS_URL}
    job_store_url: ${REDIS_URL}
    timezone: Africa/Ouagadougou
    jobs: []

  cache:
    backend: redis
    url: ${REDIS_URL}
    ttl: 300
    max_size: 10000

  # ── Celery / XWorker ──────────────────────────────────────────
  # Accès depuis les plugins : self.ctx.services.get("worker")
  # Lancer le worker   : xcore worker start celery
  # Lancer le beat     : xcore worker beat
  # Inspecter          : xcore worker inspect
  xworker:
    enabled: true

    # Nom de l'app Celery (affiché dans les logs et Flower)
    name: my-app

    # Broker et backend de résultats (Redis recommandé)
    broker_url: ${CELERY_BROKER_URL}
    result_backend: ${CELERY_RESULT_BACKEND}

    # File par défaut si aucune queue n'est précisée dans @task()
    task_default_queue: default

    # Nombre de processus worker Celery (override via -c à la CLI)
    concurrency: 4

    # Limites de temps des tâches (secondes)
    task_soft_time_limit: 300 # envoie SoftTimeLimitExceeded — pour cleanup
    task_time_limit: 3600 # kill forcé si dépassé

    # Sérialisation
    task_serializer: json
    result_serializer: json
    accept_content:
      - json

    # Durée de conservation des résultats (secondes) — 24h
    result_expires: 86400

    broker_connection_retry_on_startup: true

    # Files d'attente déclarées
    queues:
      - default
      - result
      # - emails       # ajouter selon les besoins de l'application
      - submissions

    # Modules Python contenant les tâches @task() à charger au démarrage
    # Exemple : modules: [myapp.tasks.emails, myapp.tasks.reports]
    modules:
      - app.marketplace.src.tasks
      - app.xservices.src.tasks

  extensions:
    email:
      module: extensions.xmailler.main:EmailService
      config:
        smtp_host: ${XAUTH_SMTP_HOST}
        smtp_port: ${XAUTH_SMTP_PORT}
        smtp_user: ${XAUTH_SMTP_USER}
        smtp_password: ${XAUTH_SMTP_PASSWORD}
        from_address: ${XAUTH_SMTP_FROM}
        from_name: ${XAUTH_SMTP_FROM_NAME}
        use_tls: ${XAUTH_SMTP_USE_TLS}
        timeout: 10
        max_retries: 3
        queue_size: 100

    web_socket:
      module: extensions.xwebsocket.main:WsManager
      config:
        channel:
          - user
          - admin
          - broadcast
          - platform

    pubsub:
      module: extensions.pubsub.service:PubSubClient
      config:
        provider: "redis"
        redis:
          url: "${REDIS_URL}"
          heartbeat: 0.01

    mail_proxy:
      module: extensions.xmailproxy.main:MailProxyService
      config:
        redis_url: ${REDIS_URL}
        admin_emails:
          - ${ADMIN_EMAIL}

    # Stockage fichiers partagé — voir extensions/xstorage/main.py pour le
    # contrat complet. Consommé par app/xdeploy (artefacts .xdeploy scellés,
    # self.get_service("ext.storage") — appel non optionnel, le plugin
    # xdeploy refuse de charger sans cette entrée).
    storage:
      module: extensions.xstorage.main:StorageService
      config:
        backend: supabase
        max_size_mb: 10
        # extensions/xstorage/backends.py::build_backend lit config["supabase"]
        # (une clé SŒUR de "local", pas nichée dedans) quand backend=supabase —
        # nichée sous local: comme avant, url/key/bucket auraient été invisibles
        # et StorageService aurait planté au boot avec "storage.supabase.url
        # and storage.supabase.key are required." (échec, pas juste un warning).
        supabase:
          url: ${SUPABASE_URL}
          # Nom exact attendu par backends.py — pas SUPABASE_KEY.
          key: ${SUPABASE_SERVICE_KEY}
          bucket: ${SUPABASE_BUCKET}
          public: false

# ── Observabilité ─────────────────────────────────────────────
observability:
  logging:
    enabled: true
    level: WARNNING
    format: "%(asctime)s [%(levelname)s] [%(name)s] %(message)s"
    file: log/app.log
    max_bytes: 52428800 # 50MB
    backup_count: 10 # 50*10 =500MB for logs

  metrics:
    enabled: true
    backend: prometheus
    prefix: myapp

  tracing:
    enabled: false
    backend: noop
    service_name: my-app
    endpoint: null

# ── Sécurité ──────────────────────────────────────────────────
security:
  allowed_imports:
    - argparse
    - fastapi
    - json
    - re
    - math
    - random
    - datetime
    - time
    - pathlib
    - typing
    - dataclasses
    - enum
    - functools
    - itertools
    - collections
    - string
    - hashlib
    - base64
    - asyncio
    - logging
    - uuid
    - decimal
    - copy

  forbidden_imports: []

  rate_limit_default:
    calls: 200
    period_seconds: 60

marketplace:
  # Schéma requis — utilisée telle quelle comme base d'URL HTTP par xcli
  # (xcoreCli, voir xcli/plugin/shared.py::marketplace_api_base) et par
  # xcore.marketplace.MarketplaceClient, pas seulement comme nom de domaine
  # pour la liste CORS.
  url: http://localhost:5173 #https://marketplace.xcorehub.dev
  token: ${MARKETPLACE_TOKEN}

middleware:
  # security header
  - name: security headers
    module: middleware.security_headers:SecurityHeadersMiddleware

  # upload size
  - name: uploads size
    module: middleware.upload_size:UploadSizeLimitMiddleware
    config:
      - name: max_bytes
        value: 10485760
        type: external

  # timing request
  - name: timing
    module: xcore.kernel.api.middlewares.timing:RequestTimingMiddleware

  # cache response
  - name: cache_header
    module: xcore.kernel.api.middlewares.cache_header:CacheHeaderMiddleware
    config:
      - name: header_prefix
        type: external
        value: "X-App"
      - name: cache_getter
        type: internal
        value: cache

  # rate limit
  - name: rate limite
    module: middleware.rate_limit:RateLimitMiddleware
    config:
      - name: calls
        value: 200
        type: external
      - name: period_seconds
        value: 60
        type: external
cors:
  allow_origins:
    [
      "https://xcorehub.dev",
      "https://app.xcorehub.dev",
      "https://marketplace.xcorehub.dev",
    ]
  allow_credentials: true
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["*"]

# enable
tenancy:
  enabled: false
  header: X-TENNANT-ID
  subdomain: false
  default_tenant: default
  isolate_cache: false
  isolate_db: false
  isolate_scheduler: false
  enforce_ipc: false
