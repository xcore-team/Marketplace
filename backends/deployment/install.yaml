format_version: '1'
project_id: prj_006eb24af3a79539bf6811918b3895b9
version: 1.0.9
# Plus aucune étape install_plugin/install_extension ici : les 14 composants
# marketplace-résolus (app/marketplace, app/auth, app/xadmin, app/xdeploy,
# app/xdeployments, app/xdevkeys, app/xdocs, app/xpulses, app/xservices,
# extensions/pubsub, extensions/xmailler, extensions/xmailproxy,
# extensions/xstorage, extensions/xwebsocket) sont maintenant TOUS committés
# directement dans ce repo (backends/app/, backends/extensions/), plus rien
# n'est résolu depuis le marketplace au runtime.
#
# Raison : plusieurs de ces plugins (à commencer par app/marketplace, qui
# EST le backend marketplace lui-même) créaient une dépendance circulaire —
# resolve-sources appelle l'API marketplace pour récupérer le code des
# plugins, mais cette API est servie par CE MÊME conteneur, qui ne peut pas
# démarrer tant que resolve-sources n'a pas réussi. Reproduit en conditions
# réelles : conteneur arrêté puis relancé -> plus aucune instance pour
# servir l'artefact -> resolve-sources échoue en boucle (404), le conteneur
# ne redémarre jamais. Plutôt que de distinguer plugin par plugin lesquels
# sont sûrs (aucun ne l'est vraiment tant que ce backend est mono-instance
# sans redondance), tout est repassé en Git.
steps:
- id: prepare
  action: prepare
- id: start
  action: start
- id: healthcheck
  action: healthcheck
  depends_on:
  - start
  timeout: 30s
  retries: 3
