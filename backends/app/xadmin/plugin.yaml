name: xadmin
version: 0.1.0
author: xcore team's
description: >
  xadmin est un systeme d'administration pour marketplace

execution_mode: trusted
entry_point: src/main.py

requires:
  - name: auth
    version: ">=1.0.0, <1.3.0"
  - name: xdeployments
    version: ">=1.0.0"

permissions: []

resources:
  timeout_seconds: 10
  max_memory_mb: 100
  max_disk_mb: 1
  rate_limit:
    calls: 100
    period_seconds: 60

runtime:
  health_check:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 3

  retry:
    max_attempts: 3
    backoff_seconds: 3.0
