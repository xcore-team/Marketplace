name: marketplace
version: 1.0.0
author: xcore
description: >
  Marketplace de plugins xcore — soumission ZIP, pipeline de validation sandbox (9 gates),
  publication depuis GitHub, notifications email, enregistrement des plugins vérifiés.

execution_mode: trusted
entry_point: src/main.py
framework_version: ">=2.1.0"

# ── Dépendances inter-plugins ─────────────────────────────────────────────────
# xauth doit être chargé avant marketplace :
# il enregistre le backend JWT global (register_auth_backend)
# que get_current_user utilise dans les routes marketplace.

requires:
  - name: auth
    version: ">=1.0.0"
  - name: xdevkeys
    version: ">=1.0.0"

# ── Variables d'environnement ─────────────────────────────────────────────────
envconfiguration:
  inject: true
  env_file: .env

env:
  APP_NAME: "${MARKET_APP_NAME}"
  APP_BASE_URL: "${MARKET_APP_BASE_URL}"

  # Clé secrète HMAC pour la signature des plugins (gate 7)
  MARKET_SECRET_KEY: "${MARKET_SECRET_KEY}"

  # Clé maître pour déchiffrer les signing keys xdevkeys (routes/install.py) —
  # sans cette déclaration, ctx.env n'a jamais cette clé (elle n'est résolue
  # que depuis ce bloc, par plugin) et install.py retombe systématiquement
  # sur la constante de repli codée en dur, différente de celle utilisée par
  # xdevkeys pour chiffrer → déchiffrement impossible pour TOUT signing key.
  # Bug trouvé en testant un vrai déploiement de bout en bout ; voir aussi
  # app/xservices/plugin.yaml (même bug, même route dupliquée).
  DEVKEYS_MASTER_KEY: "${DEVKEYS_MASTER_KEY}"

  # Limites sandbox — optionnelles (valeurs par défaut si absentes)
  SANDBOX_MEMORY_MB: "${MARKET_SANDBOX_MEMORY_MB}"
  SANDBOX_CPU_SECONDS: "${MARKET_SANDBOX_CPU_SECONDS}"
  SANDBOX_TIMEOUT: "${MARKET_SANDBOX_TIMEOUT}"

# ── Permissions inter-plugins ─────────────────────────────────────────────────
permissions:
  - resource: "ext.email"
    actions: ["send", "queue"]
    effect: allow
  - resource: network
    description: "Requêtes GitHub API (repos, tags, téléchargement de ZIP) via httpx"

# ── Ressources ────────────────────────────────────────────────────────────────
resources:
  timeout_seconds: 120
  max_memory_mb: 512
  rate_limit:
    calls: 200
    period_seconds: 60

# ── Runtime ───────────────────────────────────────────────────────────────────
runtime:
  health_check:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 5
  retry:
    max_attempts: 2
    backoff_seconds: 3.0
