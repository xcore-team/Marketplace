name: xdeployments
version: 1.0.0
author: xcore team
description: >
  Statut de déploiement rapporté par xcore-agent. Un agent installé sur un
  VPS d'opérateur signale le succès/échec de chaque déploiement d'un plugin
  ou d'une extension — le marketplace n'a par ailleurs aucune visibilité sur
  ce qui tourne réellement chez les opérateurs.

execution_mode: trusted
entry_point: src/main.py

requires:
  - name: auth
    version: ">=1.0.0"
  - name: xdevkeys
    version: ">=1.0.0"

# Vide = deny_all côté PermissionEngine (voir app/xdevkeys/plugin.yaml pour
# le même correctif) — deployments.purge (ipc.py) serait sinon injoignable
# depuis xadmin malgré l'appel IPC.
permissions:
  - resource: "deployments.*"
    actions: ["*"]
    effect: allow

resources:
  timeout_seconds: 30
  max_memory_mb: 128
  rate_limit:
    calls: 200
    period_seconds: 60

runtime:
  health_check:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 5
  retry:
    max_attempts: 3
    backoff_seconds: 2.0
