name: xservices
version: 1.0.0
author: xcore
description: >
  Marketplace des extensions de service XCore.
  Permet aux développeurs de soumettre, valider et publier des extensions
  de service (BaseService) consommables par d'autres plugins XCore.

execution_mode: trusted
entry_point: src/main.py
framework_version: ">=2.1.0"

requires:
  - name: auth
    version: ">=1.0.0"
  - name: xdevkeys
    version: ">=1.0.0"

envconfiguration:
  # inject: true exige un fichier <plugin_dir>/.env qui existe réellement —
  # sinon le manifeste ENTIER est invalide et le plugin est silencieusement
  # skip (jamais "failed", juste absent du résumé de boot). xservices n'a
  # pas son propre .env : les ${VAR} du bloc env: ci-dessous résolvent
  # depuis os.environ, déjà peuplé par le .env racine au moment où les
  # plugins se chargent — inject: false suffit, pas besoin d'un fichier dédié.
  inject: false

env:
  # Clé maître pour déchiffrer les signing keys xdevkeys (routes/install.py,
  # miroir de app/marketplace) — même bug/même fix que app/marketplace/plugin.yaml,
  # trouvé en testant un vrai déploiement de bout en bout.
  DEVKEYS_MASTER_KEY: "${DEVKEYS_MASTER_KEY}"

permissions: []

resources:
  timeout_seconds: 30
  max_memory_mb: 256
  rate_limit:
    calls: 200
    period_seconds: 60

runtime:
  health_check:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 5
  retry:
    max_attempts: 3
    backoff_seconds: 2.0
