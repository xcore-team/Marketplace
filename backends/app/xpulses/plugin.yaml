name: xpulse
version: 0.1.0
author: xcore team's
description: >
  XPulse est un systeme de notification realtime

execution_mode: trusted
entry_point: src/main.py

requires:
  - name: auth
    version: ">=1.0.0, <1.3.0"

# Publié sur xcore-team/Xpulses (public) — résolu depuis git au
# build/deploy au lieu d'être embarqué, voir packer.builder._read_plugin_source.
# ref pinné sur un commit SHA (tag v0.1.0), pas une branche mutable.
source:
  url: https://github.com/xcore-team/Xpulses.git
  ref: bbf915a1e65bb65bc6d8431de5781969d3659cb0

# ── Imports autorisés ────────────────────────────────────────────────────────
allowed_imports:
  - fastapi
  - asyncio
  - dataclasses
  - json
  - logging
  - re
  - typing

permissions:
  - resource: "xpulse.publish"
    actions: ["*"]
    effect: "allow"
  - resource: "xpulse.broadcast"
    actions: ["*"]
    effect: "allow"
  - resource: "xpulse.email"
    actions: ["*"]
    effect: "allow"

resources:
  timeout_seconds: 10
  max_memory_mb: 100
  max_disk_mb: 1
  rate_limit:
    calls: 100
    period_seconds: 60

runtime:
  health_check:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 3

  retry:
    max_attempts: 3
    backoff_seconds: 3.0

envconfiguration:
  inject: false
  env_file: .env

env: {}

rbac:
  grants:
    - name: xpulse:admin:publish
      description: "Envoi d'une notification a tout les utilisateurs"
      tenant_grantable: false
      group: "notification"

    - name: xpulse:tenant:publish
      description: "Envoi d'une notification a tout les utilisateurs"
      tenant_grantable: true
      group: "notification"

    - name: xpulse:admin:broadcast
      description: "Envoi d'une notification a tout les utilisateurs"
      tenant_grantable: false
      group: "notification"

    - name: xpulse:tenant:broadcast
      description: "Envoi d'une notification a tout les utilisateurs"
      tenant_grantable: true
      group: "notification"
